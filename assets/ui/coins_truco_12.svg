<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="coinGold12" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="90%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <radialGradient id="infernalAura12" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#dc2626" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow12" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Flame background aura -->
  <circle cx="32" cy="32" r="28" fill="url(#infernalAura12)"/>
  <g filter="url(#shadow12)">
    <!-- Base pyramid layer -->
    <circle cx="12" cy="48" r="10" fill="url(#coinGold12)" stroke="#1a1205" stroke-width="1.4"/>
    <circle cx="22" cy="50" r="10" fill="url(#coinGold12)" stroke="#1a1205" stroke-width="1.4"/>
    <circle cx="32" cy="51" r="10" fill="url(#coinGold12)" stroke="#1a1205" stroke-width="1.4"/>
    <circle cx="42" cy="50" r="10" fill="url(#coinGold12)" stroke="#1a1205" stroke-width="1.4"/>
    <circle cx="52" cy="48" r="10" fill="url(#coinGold12)" stroke="#1a1205" stroke-width="1.4"/>
    <!-- 2nd layer -->
    <circle cx="17" cy="38" r="11" fill="url(#coinGold12)" stroke="#1a1205" stroke-width="1.5"/>
    <circle cx="27" cy="39" r="11" fill="url(#coinGold12)" stroke="#1a1205" stroke-width="1.5"/>
    <circle cx="37" cy="39" r="11" fill="url(#coinGold12)" stroke="#1a1205" stroke-width="1.5"/>
    <circle cx="47" cy="38" r="11" fill="url(#coinGold12)" stroke="#1a1205" stroke-width="1.5"/>
    <!-- 3rd layer -->
    <circle cx="23" cy="27" r="12" fill="url(#coinGold12)" stroke="#1a1205" stroke-width="1.6"/>
    <circle cx="41" cy="27" r="12" fill="url(#coinGold12)" stroke="#1a1205" stroke-width="1.6"/>
    <!-- Peak 12 Coin with Laurel border -->
    <circle cx="32" cy="17" r="16" fill="url(#coinGold12)" stroke="#1a1205" stroke-width="2"/>
    <circle cx="32" cy="17" r="12" fill="none" stroke="#fff" stroke-width="1.4" stroke-dasharray="2 1.5"/>
    <text x="32" y="22" font-size="13" font-weight="900" font-family="'Cinzel', serif" fill="#2d1601" text-anchor="middle">12</text>
  </g>
</svg>
