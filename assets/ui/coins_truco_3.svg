<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="coinGold3" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="90%" stop-color="#805d10"/>
      <stop offset="100%" stop-color="#3d2a04"/>
    </radialGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Coin 1 (left back) -->
  <g filter="url(#shadow3)">
    <circle cx="24" cy="38" r="15" fill="url(#coinGold3)" stroke="#1a1205" stroke-width="1.8"/>
    <circle cx="24" cy="38" r="11.5" fill="none" stroke="#fff3a1" stroke-width="1" opacity="0.6" stroke-dasharray="2 1.5"/>
    <text x="24" y="43" font-size="11" font-weight="900" font-family="'Cinzel', serif" fill="#422e03" text-anchor="middle">★</text>
  </g>
  <!-- Coin 2 (right back) -->
  <g filter="url(#shadow3)">
    <circle cx="40" cy="38" r="15" fill="url(#coinGold3)" stroke="#1a1205" stroke-width="1.8"/>
    <circle cx="40" cy="38" r="11.5" fill="none" stroke="#fff3a1" stroke-width="1" opacity="0.6" stroke-dasharray="2 1.5"/>
    <text x="40" y="43" font-size="11" font-weight="900" font-family="'Cinzel', serif" fill="#422e03" text-anchor="middle">★</text>
  </g>
  <!-- Coin 3 (center front) -->
  <g filter="url(#shadow3)">
    <circle cx="32" cy="22" r="16" fill="url(#coinGold3)" stroke="#1a1205" stroke-width="2"/>
    <circle cx="32" cy="22" r="12" fill="none" stroke="#fff3a1" stroke-width="1.2" opacity="0.8" stroke-dasharray="2 1.5"/>
    <text x="32" y="27" font-size="14" font-weight="900" font-family="'Cinzel', serif" fill="#3b2501" text-anchor="middle">3</text>
  </g>
</svg>
