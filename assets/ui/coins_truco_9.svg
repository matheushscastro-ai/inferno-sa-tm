    <circle cx="26" cy="48" r="11" fill="url(#coinGold9)" stroke="#1a1205" stroke-width="1.5"/>
    <circle cx="38" cy="48" r="11" fill="url(#coinGold9)" stroke="#1a1205" stroke-width="1.5"/>
    <circle cx="50" cy="46" r="11" fill="url(#coinGold9)" stroke="#1a1205" stroke-width="1.5"/>
    <!-- Mid 3 coins -->
    <circle cx="20" cy="34" r="12" fill="url(#coinGold9)" stroke="#1a1205" stroke-width="1.6"/>
    <circle cx="32" cy="35" r="12" fill="url(#coinGold9)" stroke="#1a1205" stroke-width="1.6"/>
    <circle cx="44" cy="34" r="12" fill="url(#coinGold9)" stroke="#1a1205" stroke-width="1.6"/>
