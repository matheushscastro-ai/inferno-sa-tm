    <circle cx="32" cy="16" r="11" fill="none" stroke="#fff4b0" stroke-width="1.2" stroke-dasharray="2 1.5"/>
    <text x="32" y="21" font-size="14" font-weight="900" font-family="'Cinzel', serif" fill="#362201" text-anchor="middle">9</text>
